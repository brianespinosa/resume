savePrefix: ''
strictPeerDependencies: true
autoInstallPeers: false
engineStrict: true
strictDepBuilds: true
minimumReleaseAge: 7200 # minutes; keep <= Dependabot cooldown default-days

# Transitive dependency version pins for supply-chain hardening.
overrides:
  '@vercel/fun>@tootallnate/once': '^3.0.1'
  '@vercel/fun>tar': '^7.5.11'
  '@vercel/node>undici': '^6.28.0'
  '@vercel/python-analysis>js-yaml': '>=4.3.1 <5'
  '@vercel/python-analysis>minimatch': '^10.2.3'
  '@vercel/python-analysis>smol-toml': '^1.7.1'
  '@vercel/rust>smol-toml': '^1.7.1'
  tsx>esbuild: '^0.28.1'
  vercel>smol-toml: '^1.7.1'
  vercel>undici: '^6.28.0'

# Packages whose install/postinstall scripts are reviewed and approved to run
# under strictDepBuilds.
allowBuilds:
  # Native binary postinstall, pulled in by sass's file watcher. Maintained by
  # the Parcel team; the build step only selects/builds the prebuilt binary.
  '@parcel/watcher': true
  # Postinstall fetches the platform-specific binary; required by vite/vitest.
  esbuild: true
  # Postinstall registers this repo's git hooks; the whole point of the package.
  lefthook: true
